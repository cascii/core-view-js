name: npm

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example, 0.3.1 or 0.4.0-beta.1)
        required: true
        type: string
      tag:
        description: npm dist-tag to publish under
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Set manual release version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Detect publishable version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_NAME=$(node --eval "console.log(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name)")
          PACKAGE_VERSION=$(node --eval "console.log(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$PACKAGE_VERSION" != "$REQUESTED_VERSION" ]; then
              echo "Requested version ($REQUESTED_VERSION) is not a valid normalized npm version ($PACKAGE_VERSION)" >&2
              exit 1
            fi
          else
            SSMVER_VERSION=$(sed -n 's/^version = \"\(.*\)\"/\1/p' ssmver.toml | head -1)

            if [ -z "$SSMVER_VERSION" ]; then
              echo "Could not read version from ssmver.toml" >&2
              exit 1
            fi

            if [ "$PACKAGE_VERSION" != "$SSMVER_VERSION" ]; then
              echo "package.json version ($PACKAGE_VERSION) does not match ssmver.toml ($SSMVER_VERSION)" >&2
              exit 1
            fi
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.npm.outputs.already_published != 'true'
        run: npm run build

      - name: Publish package
        if: steps.npm.outputs.already_published != 'true'
        env:
          NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}
        run: npm publish --provenance --access public --tag "$NPM_TAG"
